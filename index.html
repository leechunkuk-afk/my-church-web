<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테일즈 러너 - 웹게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 100;
        }
        
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 200;
        }
        
        #startScreen h1, #gameOverScreen h1 {
            color: #ff6b6b;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        #startScreen p, #gameOverScreen p {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        button {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6);
        }
        
        .hidden {
            display: none !important;
        }
        
        #finalScore {
            font-size: 36px;
            color: #4ecdc4;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Coins: <span id="coins">0</span></div>
    </div>
    
    <div id="startScreen">
        <h1>🏃 테일즈 러너 🏃</h1>
        <p>스페이스바 또는 화면 터치로 점프하세요!<br>장애물을 피하고 코인을 모으세요!</p>
        <button onclick="startGame()">게임 시작</button>
    </div>
    
    <div id="gameOverScreen" class="hidden">
        <h1>게임 오버!</h1>
        <div id="finalScore">Score: 0</div>
        <p>다시 도전해보세요!</p>
        <button onclick="startGame()">다시 시작</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 캔버스 크기 설정
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 게임 상태
        let gameRunning = false;
        let score = 0;
        let coinCount = 0;
        let gameSpeed = 5;
        let frameCount = 0;
        
        // 플레이어 설정
        const player = {
            x: 100,
            y: canvas.height - 150,
            width: 50,
            height: 70,
            velocityY: 0,
            gravity: 0.8,
            jumpPower: -15,
            jumping: false,
            color: '#ff6b6b',
            runFrame: 0
        };
        
        // 장애물 배열
        let obstacles = [];
        // 코인 배열
        let coins = [];
        // 구름 배열 (배경)
        let clouds = [];
        
        // 키보드 입력
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameRunning) {
                jump();
            }
        });
        
        // 터치 입력
        document.addEventListener('touchstart', (e) => {
            if (gameRunning) {
                jump();
            }
        });
        
        function jump() {
            if (!player.jumping) {
                player.velocityY = player.jumpPower;
                player.jumping = true;
            }
        }
        
        function createObstacle() {
            const types = ['box', 'spike', 'tall'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            let obstacle = {
                x: canvas.width,
                y: canvas.height - 100,
                width: 40,
                height: 40,
                type: type,
                passed: false
            };
            
            if (type === 'spike') {
                obstacle.height = 30;
                obstacle.y = canvas.height - 100 + 10;
            } else if (type === 'tall') {
                obstacle.height = 70;
                obstacle.width = 30;
            }
            
            obstacles.push(obstacle);
        }
        
        function createCoin() {
            const coin = {
                x: canvas.width,
                y: canvas.height - 100 - Math.random() * 100,
                width: 30,
                height: 30,
                collected: false
            };
            coins.push(coin);
        }
        
        function createCloud() {
            const cloud = {
                x: canvas.width,
                y: Math.random() * 200,
                width: 60 + Math.random() * 40,
                height: 30 + Math.random() * 20,
                speed: 1 + Math.random() * 2
            };
            clouds.push(cloud);
        }
        
        function updatePlayer() {
            // 중력 적용
            player.velocityY += player.gravity;
            player.y += player.velocityY;
            
            // 바닥 충돌 검사
            if (player.y >= canvas.height - 150) {
                player.y = canvas.height - 150;
                player.velocityY = 0;
                player.jumping = false;
            }
            
            // 달리기 애니메이션
            if (!player.jumping) {
                player.runFrame = (player.runFrame + 1) % 20;
            }
        }
        
        function updateObstacles() {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;
                
                // 화면 밖으로 나간 장애물 제거
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    continue;
                }
                
                // 충돌 검사
                if (checkCollision(player, obstacles[i])) {
                    gameOver();
                }
                
                // 점수 추가 (장애물 통과 시)
                if (!obstacles[i].passed && obstacles[i].x + obstacles[i].width < player.x) {
                    obstacles[i].passed = true;
                    score += 10;
                }
            }
        }
        
        function updateCoins() {
            for (let i = coins.length - 1; i >= 0; i--) {
                coins[i].x -= gameSpeed;
                
                // 화면 밖으로 나간 코인 제거
                if (coins[i].x + coins[i].width < 0) {
                    coins.splice(i, 1);
                    continue;
                }
                
                // 코인 수집
                if (!coins[i].collected && checkCollision(player, coins[i])) {
                    coins[i].collected = true;
                    coinCount++;
                    score += 5;
                    coins.splice(i, 1);
                }
            }
        }
        
        function updateClouds() {
            for (let i = clouds.length - 1; i >= 0; i--) {
                clouds[i].x -= clouds[i].speed;
                
                if (clouds[i].x + clouds[i].width < 0) {
                    clouds.splice(i, 1);
                }
            }
        }
        
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        function drawPlayer() {
            ctx.save();
            
            // 몸통
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // 얼굴
            ctx.fillStyle = '#FFE4C4';
            ctx.fillRect(player.x + 5, player.y + 5, player.width - 10, 25);
            
            // 눈
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(player.x + 20, player.y + 15, 4, 0, Math.PI * 2);
            ctx.arc(player.x + 35, player.y + 15, 4, 0, Math.PI * 2);
            ctx.fill();
            
            // 입
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(player.x + 27, player.y + 22, 8, 0, Math.PI);
            ctx.stroke();
            
            // 다리 (달리기 애니메이션)
            ctx.fillStyle = player.color;
            if (player.jumping) {
                // 점프 자세
                ctx.fillRect(player.x + 5, player.y + player.height, 15, 20);
                ctx.fillRect(player.x + 30, player.y + player.height, 15, 15);
            } else {
                // 달리기 자세
                const legOffset = Math.sin(player.runFrame * Math.PI / 10) * 10;
                ctx.fillRect(player.x + 5, player.y + player.height, 15, 20 + legOffset);
                ctx.fillRect(player.x + 30, player.y + player.height, 15, 20 - legOffset);
            }
            
            ctx.restore();
        }
        
        function drawObstacles() {
            obstacles.forEach(obstacle => {
                ctx.save();
                
                if (obstacle.type === 'box') {
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                    
                    // 상자 디테일
                    ctx.strokeStyle = '#654321';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                } else if (obstacle.type === 'spike') {
                    ctx.fillStyle = '#666';
                    ctx.beginPath();
                    ctx.moveTo(obstacle.x, obstacle.y + obstacle.height);
                    ctx.lineTo(obstacle.x + obstacle.width / 2, obstacle.y);
                    ctx.lineTo(obstacle.x + obstacle.width, obstacle.y + obstacle.height);
                    ctx.closePath();
                    ctx.fill();
                } else if (obstacle.type === 'tall') {
                    ctx.fillStyle = '#2E8B57';
                    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                    
                    // 풀 디테일
                    ctx.fillStyle = '#3CB371';
                    ctx.fillRect(obstacle.x + 5, obstacle.y + 5, obstacle.width - 10, obstacle.height - 10);
                }
                
                ctx.restore();
            });
        }
        
        function drawCoins() {
            coins.forEach(coin => {
                ctx.save();
                
                // 코인 본체
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(coin.x + coin.width/2, coin.y + coin.height/2, coin.width/2, 0, Math.PI * 2);
                ctx.fill();
                
                // 코인 광택
                ctx.fillStyle = '#FFF8DC';
                ctx.beginPath();
                ctx.arc(coin.x + coin.width/2 - 5, coin.y + coin.height/2 - 5, coin.width/6, 0, Math.PI * 2);
                ctx.fill();
                
                // 코인 테두리
                ctx.strokeStyle = '#DAA520';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(coin.x + coin.width/2, coin.y + coin.height/2, coin.width/2, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.restore();
            });
        }
        
        function drawClouds() {
            ctx.save();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.width/3, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width/3, cloud.y - cloud.height/3, cloud.width/4, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.width/2, cloud.y, cloud.width/3, 0, Math.PI * 2);
                ctx.fill();
            });
            
            ctx.restore();
        }
        
        function drawGround() {
            ctx.save();
            
            // 지면
            ctx.fillStyle = '#8FBC8F';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            
            // 잔무늬
            ctx.fillStyle = '#90EE90';
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.fillRect(i - (frameCount * gameSpeed) % 50, canvas.height - 90, 30, 10);
            }
            
            ctx.restore();
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('coins').textContent = coinCount;
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            
            // 캔버스 클리어
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 배경 구름 그리기
            drawClouds();
            
            // 지면 그리기
            drawGround();
            
            // 코인 그리기
            drawCoins();
            
            // 장애물 그리기
            drawObstacles();
            
            // 플레이어 그리기
            drawPlayer();
            
            // 업데이트
            updatePlayer();
            updateObstacles();
            updateCoins();
            updateClouds();
            updateUI();
            
            // 게임 속도 점점 증가
            frameCount++;
            if (frameCount % 600 === 0) {
                gameSpeed += 0.5;
            }
            
            // 장애물 생성
            if (frameCount % 90 === 0) {
                createObstacle();
            }
            
            // 코인 생성
            if (frameCount % 60 === 0) {
                createCoin();
            }
            
            // 구름 생성
            if (frameCount % 120 === 0) {
                createCloud();
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        function startGame() {
            // 게임 초기화
            gameRunning = true;
            score = 0;
            coinCount = 0;
            gameSpeed = 5;
            frameCount = 0;
            obstacles = [];
            coins = [];
            clouds = [];
            player.y = canvas.height - 150;
            player.velocityY = 0;
            player.jumping = false;
            
            // UI 숨기기
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            
            // 게임 루프 시작
            gameLoop();
        }
        
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = `Score: ${score} | Coins: ${coinCount}`;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }
        
        // 창 크기 변경 시 캔버스 리사이즈
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - 150;
        });
        
        // 초기 구름 생성
        for (let i = 0; i < 5; i++) {
            createCloud();
            clouds[i].x = Math.random() * canvas.width;
        }
    </script>
</body>
</html>
